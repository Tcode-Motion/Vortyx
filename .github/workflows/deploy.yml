name: Build, Test and Verify Vortyx Production

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "ci"
  cancel-in-progress: false

jobs:
  build-and-test:
    name: Build & Verify Production Architecture
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Execute Extension API Tests
        run: npm run test:ext

      - name: Execute SEO & Metadata Audit
        run: npm run test:seo

      - name: Execute Storage & Pipeline Smoke Tests
        run: npm run test:smoke

      - name: Build Next.js Production App
        run: npm run build
