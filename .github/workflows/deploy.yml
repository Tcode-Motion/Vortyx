name: Build, Test and Deploy Vortyx Website

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "deploy"
  cancel-in-progress: false

jobs:
  build-test-and-deploy:
    name: Build, Test & Deploy to GitHub Pages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Execute Extension API Tests
        run: npm run test:ext

      - name: Execute SEO & Metadata Audit
        run: npm run test:seo

      - name: Execute Storage & Pipeline Smoke Tests
        run: npm run test:smoke

      - name: Build Next.js Production App
        run: npm run build

      - name: Deploy to GitHub Pages Branch (gh-pages)
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          commit_message: "deploy: automated production release to GitHub Pages [skip ci]"
