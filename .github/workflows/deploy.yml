name: Build, Test and Deploy Vortyx Production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "deploy"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build, Verify & Deploy Production Architecture
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Execute Extension API Tests
        run: npm run test:ext

      - name: Execute SEO & Metadata Audit
        run: npm run test:seo

      - name: Execute Storage & Pipeline Smoke Tests
        run: npm run test:smoke

      - name: Build & Export Static Web Production Bundle
        run: npm run build

      - name: Verify All Production Assets and Subpath Routes
        run: npx tsx tests/verify_assets_and_routes.ts

      - name: Deploy to GitHub Pages (gh-pages Branch)
        if: github.ref == 'refs/heads/main'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: out
          branch: gh-pages
          clean: true
